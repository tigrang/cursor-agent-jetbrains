name: Build and release plugin
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.9.1'
      - run: gradle clean test buildPlugin
      - name: Verify tag and generate checksum
        working-directory: build/distributions
        run: |
          archive="cursor-agent-jetbrains-${GITHUB_REF_NAME#v}.zip"
          if [[ ! -f "$archive" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match the plugin version in build.gradle.kts."
            exit 1
          fi
          sha256sum -- "$archive" > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cursor-agent-jetbrains-plugin
          path: |
            build/distributions/*.zip
            build/distributions/SHA256SUMS.txt
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cursor-agent-jetbrains-plugin
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="cursor-agent-jetbrains-${GITHUB_REF_NAME#v}.zip"
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$archive" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
